<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Wind Karte</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    #map {
      height: 100vh;
      width: 100%;
    }
  </style>
</head>

<body>

<div id="map"></div>

<script>

const map = L.map('map').setView([48.5, 11.5], 7);

// 🗺️ Base Map
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; OpenStreetMap'
}).addTo(map);

// 📦 Gebiet
fetch('gebiet.geojson')
  .then(res => res.json())
  .then(data => {
    L.geoJSON(data, {
      style: {
        color: 'red',
        weight: 2,
        fillOpacity: 0.2
      }
    }).addTo(map);
  });

// 🌬️ WIND GRID (mehrere Punkte = Wind sichtbar)
const points = [];

for (let lat = 48.0; lat <= 49.0; lat += 0.3) {
  for (let lon = 11.0; lon <= 12.0; lon += 0.3) {
    points.push([lat, lon]);
  }
}

// 🌪️ Wind für jeden Punkt holen
points.forEach(p => {

  fetch(`https://api.open-meteo.com/v1/forecast?latitude=${p[0]}&longitude=${p[1]}&current=wind_speed_10m,wind_direction_10m`)
    .then(res => res.json())
    .then(data => {

      const speed = data.current.wind_speed_10m;

      const marker = L.circleMarker(p, {
        radius: 4 + speed / 5,
        color: "deepskyblue",
        fillOpacity: 0.6
      }).addTo(map);

      marker.bindPopup(
        "🌬️ Wind:<br>" +
        "Speed: " + speed + " km/h"
      );

    });

});

console.log("Wind Grid geladen ✔");

</script>

</body>
</html>

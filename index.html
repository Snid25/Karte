<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Karte mit Gebiet + Wind</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    #map {
      height: 100vh;
      width: 100%;
    }
  </style>
</head>

<body>

<div id="map"></div>

<script>

const map = L.map('map').setView([48.5, 11.5], 7);

// 🗺️ Base Map
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; OpenStreetMap'
}).addTo(map);

// 📦 Dein Gebiet
fetch('gebiet.geojson')
  .then(res => res.json())
  .then(data => {
    L.geoJSON(data, {
      style: {
        color: 'red',
        weight: 2,
        fillOpacity: 0.3
      }
    }).addTo(map);
  });

// 🌬️ Winddaten holen
fetch("https://api.open-meteo.com/v1/forecast?latitude=48.5&longitude=11.5&current=wind_speed_10m,wind_direction_10m")
  .then(res => res.json())
  .then(data => {

    const speed = data.current.wind_speed_10m;
    const dir = data.current.wind_direction_10m;

    // 🧭 mehrere Punkte für „Windgefühl“
    const points = [
      [48.5, 11.5],
      [48.7, 11.7],
      [48.3, 11.3],
      [48.6, 11.2],
      [48.4, 11.8]
    ];

    points.forEach(p => {

      L.circleMarker(p, {
        radius: 6,
        color: "blue",
        fillOpacity: 0.6
      })
      .addTo(map)
      .bindPopup(
        "🌬️ Wind:<br>" +
        "Speed: " + speed + " km/h<br>" +
        "Direction: " + dir + "°"
      );

    });

  })
  .catch(err => console.error("Wind Fehler:", err));

console.log("Karte geladen ✔");

</script>

</body>
</html>

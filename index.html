<script>

const map = L.map('map').setView([48.5, 11.5], 7);

// 🗺️ Base Map
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; OpenStreetMap'
}).addTo(map);

// 📦 DEIN GEBIET laden
let areaLayer = null;

fetch('gebiet.geojson')
  .then(res => res.json())
  .then(data => {

    areaLayer = L.geoJSON(data, {
      style: {
        color: 'red',
        weight: 2,
        fillOpacity: 0.2
      }
    }).addTo(map);

    // 🌬️ NUR innerhalb Gebiet Punkte erzeugen
    const bounds = areaLayer.getBounds();

    const speedBase = 5; // fallback

    const markers = [];

    for (let lat = bounds.getSouth(); lat < bounds.getNorth(); lat += 0.15) {
      for (let lon = bounds.getWest(); lon < bounds.getEast(); lon += 0.15) {

        const m = L.circleMarker([lat, lon], {
          radius: 4,
          color: "deepskyblue",
          fillOpacity: 0.5
        }).addTo(map);

        markers.push(m);
      }
    }

    // 🌬️ Animation = „Windgefühl“
    setInterval(() => {
      markers.forEach(m => {
        m.setStyle({
          fillOpacity: 0.3 + Math.random() * 0.5
        });
      });
    }, 600);

  });

</script>

<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Wind Karte (Windy Style)</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    #map {
      height: 100vh;
      width: 100%;
    }

    .wind-dot {
      width: 6px;
      height: 6px;
      background: rgba(0, 150, 255, 0.8);
      border-radius: 50%;
      position: absolute;
    }
  </style>
</head>

<body>

<div id="map"></div>

<script>

const map = L.map('map').setView([48.5, 11.5], 6);

// 🗺️ Base Map
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; OpenStreetMap'
}).addTo(map);

// 📦 GeoJSON Gebiet
fetch('gebiet.geojson')
  .then(res => res.json())
  .then(data => {
    L.geoJSON(data, {
      style: {
        color: 'red',
        weight: 2,
        fillOpacity: 0.2
      }
    }).addTo(map);
  });

// 🌬️ Winddaten (einfaches Raster simuliert)
fetch("https://api.open-meteo.com/v1/forecast?latitude=48.5&longitude=11.5&current=wind_speed_10m,wind_direction_10m")
  .then(res => res.json())
  .then(data => {

    const speed = data.current.wind_speed_10m;
    const dir = data.current.wind_direction_10m;

    // 🌪️ „Windfeld Simulation“ (wie Windy Look)
    const grid = [];

    for (let lat = 48.0; lat <= 49.0; lat += 0.2) {
      for (let lon = 11.0; lon <= 12.0; lon += 0.2) {

        const marker = L.circleMarker([lat, lon], {
          radius: 3,
          color: "deepskyblue",
          fillOpacity: 0.7
        }).addTo(map);

        grid.push(marker);

        // 🌬️ leichte Animation
        let offset = Math.random() * 2000;

        setInterval(() => {
          const opacity = 0.3 + Math.random() * 0.7;
          marker.setStyle({ fillOpacity: opacity });
        }, 800 + offset);

      }
    }

  });

console.log("Windy Clone läuft ✔");

</script>

</body>
</html>

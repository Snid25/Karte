<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Karte mit Gebiet + Wind</title>

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    #map {
      height: 100vh;
      width: 100%;
    }
  </style>
</head>

<body>

<div id="map"></div>

<script>
  // 🗺️ Karte starten
  const map = L.map('map').setView([48.5, 11.5], 8);

  // 🌍 OpenStreetMap Hintergrund
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap'
  }).addTo(map);

  // 📦 DEIN GEBIET (GeoJSON)
  fetch('gebiet.geojson')
    .then(res => res.json())
    .then(data => {
      L.geoJSON(data, {
        style: {
          color: 'red',
          weight: 2,
          fillOpacity: 0.3
        }
      }).addTo(map);
    })
    .catch(err => console.error("GeoJSON Fehler:", err));

  // 🌬️ WIND TEST-LAYER (kostenlos, ohne API-Key)
  L.tileLayer(
    "https://tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
      opacity: 0.25
    }
  ).addTo(map);

  console.log("Karte geladen ✔");

</script>

</body>
</html>
